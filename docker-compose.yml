services:
  ml-service:
    build: .
    container_name: ${CONTAINER_ML_CHEGE_PHOTOS:-ml-chege-photos}
    ports:
      - "${ML_CHEGE_PHOTOS_API_PORT:-9051}:8000"
    env_file: .env
    volumes:
      - "../Chege Photos WebApp/public/uploads:/app/uploads:ro"
      - insightface_models:/app/models/insightface_models
    depends_on:
      ml-qdrant:
        condition: service_started
    networks:
      - shared-network
    restart: unless-stopped

  ml-qdrant:
    image: qdrant/qdrant:latest
    container_name: ${CONTAINER_QDRANT:-ml-qdrant}
    ports:
      - "${ML_CHEGE_PHOTOS_QDRANT_HTTP:-9052}:6333"
      - "${ML_CHEGE_PHOTOS_QDRANT_GRPC:-9053}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - shared-network
    restart: unless-stopped

volumes:
  qdrant_data:
  insightface_models:

networks:
  shared-network:
    name: ${NETWORK_NAME:-hosts-shared-network}
    external: true
